<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satori - 桌宠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: transparent;
            user-select: none;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        :root {
            --window-scale: 1;
        }
        #subtitle-container {
            position: fixed;
            bottom: calc(120px * var(--window-scale));
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            text-align: center;
            pointer-events: none;
        }
        #subtitle-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(4px * var(--window-scale));
        }
        .subtitle-msg {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: calc(16px * var(--window-scale));
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
            padding: calc(8px * var(--window-scale)) calc(16px * var(--window-scale));
            background: rgba(0,0,0,0.3);
            border-radius: calc(20px * var(--window-scale));
            display: inline-block;
            line-height: 1.4;
            margin: 0;
        }
        #chat-container {
            position: fixed;
            bottom: calc(20px * var(--window-scale));
            right: calc(20px * var(--window-scale));
            width: calc(300px * var(--window-scale));
            display: flex;
            gap: calc(8px * var(--window-scale));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        body:hover #chat-container {
            opacity: 1;
            pointer-events: auto;
        }
        #chat-input {
            flex: 1;
            padding: calc(12px * var(--window-scale)) calc(16px * var(--window-scale));
            border: none;
            border-radius: calc(20px * var(--window-scale));
            background: rgba(255,255,255,0.9);
            font-size: calc(14px * var(--window-scale));
            outline: none;
            color: #333;
        }
        #chat-input::placeholder {
            color: #999;
        }
        #chat-send-btn {
            padding: calc(12px * var(--window-scale)) calc(20px * var(--window-scale));
            border: none;
            border-radius: calc(20px * var(--window-scale));
            background: #ff69b4;
            color: #fff;
            font-size: calc(14px * var(--window-scale));
            cursor: pointer;
            transition: background 0.2s;
        }
        #chat-send-btn:hover {
            background: #ff1493;
        }
        #error-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            color: #fff;
            padding: 30px 40px;
            border-radius: 16px;
            font-size: 18px;
            text-align: center;
            max-width: 80%;
            display: none;
            z-index: 9999;
        }
        #error-overlay h3 {
            margin-bottom: 15px;
            font-size: 24px;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            display: none;
        }
        #settings-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10000;
        }
        #settings-overlay.visible {
            display: flex;
        }
        #settings-panel {
            background: rgba(30,30,40,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 24px;
            min-width: 280px;
            color: #ddd;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        #settings-panel h3 {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: #fff;
            text-align: center;
        }
        #settings-panel label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #aaa;
        }
        #settings-panel .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        #settings-panel .row input[type="range"] {
            flex: 1;
            accent-color: #ff69b4;
        }
        #settings-panel .row .val {
            min-width: 36px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: #ff69b4;
        }
        #settings-panel .toggle-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #settings-panel .toggle-row span {
            font-size: 13px;
            color: #aaa;
        }
        #settings-panel .toggle {
            width: 44px; height: 24px;
            border-radius: 12px;
            background: #555;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }
        #settings-panel .toggle.on {
            background: #ff69b4;
        }
        #settings-panel .toggle::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }
        #settings-panel .toggle.on::after {
            transform: translateX(20px);
        }
        #settings-panel .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        #settings-panel button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }
        #settings-panel .btn-save {
            background: #ff69b4;
            color: #fff;
        }
        #settings-panel .btn-save:hover { background: #ff1493; }
        #settings-panel .btn-close {
            background: rgba(255,255,255,0.1);
            color: #ccc;
        }
        #settings-panel .btn-close:hover { background: rgba(255,255,255,0.2); }
        /* Mic indicator animations */
        @keyframes mic-pulse {
            0%, 100% { transform: scale(1); opacity: 0.9; }
            50% { transform: scale(1.15); opacity: 1; }
        }
        @keyframes mic-spin {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }
        @keyframes mic-blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.2; }
        }
        #settings-panel .settings-sep {
            border: none;
            border-top: 1px solid rgba(255,255,255,0.1);
            margin: 14px 0 12px 0;
        }
        #settings-panel .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #settings-panel .settings-row span {
            font-size: 13px;
            color: #aaa;
        }
        #settings-panel .settings-row input[type="range"] {
            flex: 1;
            margin: 0 8px;
            accent-color: #ff69b4;
        }
        #settings-panel .settings-row .val {
            min-width: 36px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: #ff69b4;
        }
        /* Voice settings panel - same style, separate overlay */
        #voice-settings-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 10001;
        }
        #voice-settings-overlay.visible {
            display: flex;
        }
        #voice-settings-panel {
            background: rgba(30,30,40,0.95);
            border: 1px solid rgba(255,255,255,0.15);
            border-radius: 16px;
            padding: 24px;
            min-width: 280px;
            color: #ddd;
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            box-shadow: 0 8px 40px rgba(0,0,0,0.5);
        }
        #voice-settings-panel h3 {
            margin: 0 0 16px 0;
            font-size: 16px;
            color: #fff;
            text-align: center;
        }
        #voice-settings-panel label {
            display: block;
            font-size: 13px;
            margin-bottom: 4px;
            color: #aaa;
        }
        #voice-settings-panel .row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 12px;
        }
        #voice-settings-panel .row input[type="range"] {
            flex: 1;
            accent-color: #ff69b4;
        }
        #voice-settings-panel .row .val {
            min-width: 36px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: #ff69b4;
        }
        #voice-settings-panel .settings-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 12px;
        }
        #voice-settings-panel .settings-row span {
            font-size: 13px;
            color: #aaa;
        }
        #voice-settings-panel .settings-row input[type="range"] {
            flex: 1;
            margin: 0 8px;
            accent-color: #ff69b4;
        }
        #voice-settings-panel .settings-row .val {
            min-width: 36px;
            text-align: right;
            font-size: 14px;
            font-weight: bold;
            color: #ff69b4;
        }
        #voice-settings-panel .toggle {
            width: 44px; height: 24px;
            border-radius: 12px;
            background: #555;
            cursor: pointer;
            position: relative;
            transition: background 0.2s;
        }
        #voice-settings-panel .toggle.on {
            background: #ff69b4;
        }
        #voice-settings-panel .toggle::after {
            content: '';
            position: absolute;
            top: 3px; left: 3px;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: #fff;
            transition: transform 0.2s;
        }
        #voice-settings-panel .toggle.on::after {
            transform: translateX(20px);
        }
        #voice-settings-panel .btn-row {
            display: flex;
            gap: 8px;
            margin-top: 16px;
        }
        #voice-settings-panel button {
            flex: 1;
            padding: 8px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 13px;
            font-family: inherit;
        }
        #voice-settings-panel .btn-save {
            background: #ff69b4;
            color: #fff;
        }
        #voice-settings-panel .btn-save:hover { background: #ff1493; }
        #voice-settings-panel .btn-close {
            background: rgba(255,255,255,0.1);
            color: #ccc;
        }
        #voice-settings-panel .btn-close:hover { background: rgba(255,255,255,0.2); }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="subtitle-container">
        <div id="subtitle-text"></div>
    </div>

    <div id="chat-container">
        <input type="text" id="chat-input" placeholder="输入消息..." autocomplete="off">
        <button id="chat-send-btn">发送</button>
    </div>

    <div id="loading">加载中...</div>
    <div id="error-overlay">
        <h3>配置错误</h3>
        <p id="error-message"></p>
    </div>

    <div id="settings-overlay">
        <div id="settings-panel">
            <h3>互动频率设置</h3>
            <div class="toggle-row">
                <span>启用主动交互</span>
                <div class="toggle on" id="toggle-enabled"></div>
            </div>
            <div class="toggle-row">
                <span>启动时打招呼</span>
                <div class="toggle on" id="toggle-startup-greeting"></div>
            </div>
            <label>最小间隔（<span id="val-min">8</span> 分钟）</label>
            <div class="row">
                <input type="range" id="range-min" min="1" max="60" value="8">
                <span class="val" id="disp-min">8</span>
            </div>
            <label>最大间隔（<span id="val-max">20</span> 分钟）</label>
            <div class="row">
                <input type="range" id="range-max" min="2" max="120" value="20">
                <span class="val" id="disp-max">20</span>
            </div>
            <div class="btn-row">
                <button class="btn-close" id="btn-settings-close">取消</button>
                <button class="btn-save" id="btn-settings-save">保存</button>
            </div>
        </div>
    </div>

    <div id="voice-settings-overlay">
        <div id="voice-settings-panel">
            <h3>语音对话设置</h3>
            <div class="settings-row">
                <span>启用语音对话</span>
                <div class="toggle" id="toggle-voice-enabled"></div>
            </div>
            <div class="settings-row">
                <span>自动发送</span>
                <div class="toggle on" id="toggle-voice-autosend"></div>
            </div>
            <label>静音阈值（<span id="val-silence">1.5</span> 秒）</label>
            <div class="row">
                <input type="range" id="range-silence-timeout" min="10" max="20" value="15" step="1">
                <span class="val" id="disp-silence">1.5</span>
            </div>
            <div class="btn-row">
                <button class="btn-close" id="btn-voice-settings-close">取消</button>
                <button class="btn-save" id="btn-voice-settings-save">保存</button>
            </div>
        </div>
    </div>

    <script src="libs/pixi.min.js"></script>
    <script src="libs/live2d.min.js"></script>
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi-live2d-display.min.js"></script>
    <script src="libs/pixi-live2d-display-extra.min.js"></script>
    <script src="js/model-interaction.js"></script>
    <script src="js/model-setup.js"></script>
    <script src="js/live2d-chat.js"></script>
    <script src="js/live2d-settings.js"></script>
    <script src="js/live2d-voice.js"></script>
    <script src="js/live2d-actions.js"></script>
</body>
</html>
