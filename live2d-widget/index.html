<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Satori - 桌宠</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            overflow: hidden;
            background: transparent;
            user-select: none;
        }
        #canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
        }
        :root {
            --window-scale: 1;
        }
        #subtitle-container {
            position: fixed;
            bottom: calc(120px * var(--window-scale));
            left: 50%;
            transform: translateX(-50%);
            max-width: 80%;
            text-align: center;
            pointer-events: none;
        }
        #subtitle-text {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: calc(4px * var(--window-scale));
        }
        .subtitle-msg {
            font-family: 'Segoe UI', 'Microsoft YaHei', sans-serif;
            font-size: calc(16px * var(--window-scale));
            color: #fff;
            text-shadow: 0 0 10px rgba(0,0,0,0.8), 0 0 20px rgba(0,0,0,0.6);
            padding: calc(8px * var(--window-scale)) calc(16px * var(--window-scale));
            background: rgba(0,0,0,0.3);
            border-radius: calc(20px * var(--window-scale));
            display: inline-block;
            line-height: 1.4;
            margin: 0;
        }
        #chat-container {
            position: fixed;
            bottom: calc(20px * var(--window-scale));
            right: calc(20px * var(--window-scale));
            width: calc(300px * var(--window-scale));
            display: flex;
            gap: calc(8px * var(--window-scale));
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }
        body:hover #chat-container {
            opacity: 1;
            pointer-events: auto;
        }
        #chat-input {
            flex: 1;
            padding: calc(12px * var(--window-scale)) calc(16px * var(--window-scale));
            border: none;
            border-radius: calc(20px * var(--window-scale));
            background: rgba(255,255,255,0.9);
            font-size: calc(14px * var(--window-scale));
            outline: none;
            color: #333;
        }
        #chat-input::placeholder {
            color: #999;
        }
        #chat-send-btn {
            padding: calc(12px * var(--window-scale)) calc(20px * var(--window-scale));
            border: none;
            border-radius: calc(20px * var(--window-scale));
            background: #ff69b4;
            color: #fff;
            font-size: calc(14px * var(--window-scale));
            cursor: pointer;
            transition: background 0.2s;
        }
        #chat-send-btn:hover {
            background: #ff1493;
        }
        #error-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(255,0,0,0.9);
            color: #fff;
            padding: 30px 40px;
            border-radius: 16px;
            font-size: 18px;
            text-align: center;
            max-width: 80%;
            display: none;
            z-index: 9999;
        }
        #error-overlay h3 {
            margin-bottom: 15px;
            font-size: 24px;
        }
        #loading {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #fff;
            font-size: 18px;
            display: none;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

    <div id="subtitle-container">
        <div id="subtitle-text"></div>
    </div>

    <div id="chat-container">
        <input type="text" id="chat-input" placeholder="输入消息..." autocomplete="off">
        <button id="chat-send-btn">发送</button>
    </div>

    <div id="loading">加载中...</div>
    <div id="error-overlay">
        <h3>配置错误</h3>
        <p id="error-message"></p>
    </div>

    <script src="libs/pixi.min.js"></script>
    <script src="libs/live2d.min.js"></script>
    <script src="libs/live2dcubismcore.min.js"></script>
    <script src="libs/pixi-live2d-display.min.js"></script>
    <script src="libs/pixi-live2d-display-extra.min.js"></script>
    <script src="js/model-interaction.js"></script>
    <script src="js/model-setup.js"></script>
    <script src="js/live2d-chat.js"></script>
</body>
</html>
